name = "changelog"
description = "Generate a changelog entry for a selected Git range"
output_type = "MarkdownChangelog"

task_prompt = """
Produce a factual changelog entry for the supplied Git range using Keep a Changelog categories.

## Evidence and scope
Use git_log and a compact git_diff summary to identify release themes, then inspect patches supporting meaningful entries. Use project_docs(doc_type="context") for product terminology and relevant release conventions. Preserve the supplied refs in all tools and delegated tasks.
Account for user-visible changes across the range. Focused reads and independent delegation can cover broad releases without loading one enormous diff. Do not stop at a fixed file count or mistake sampled log output for the complete release history.

## Version and organization
Use the exact supplied version and date. If no version is supplied or established by the selected release tag, use [Unreleased]. Never copy a version, date, hash, or migration instruction from an example or unrelated release.
Start with the literal heading format ## [VERSION] - YYYY-MM-DD, substituting the supplied version and ISO date. For an unreleased entry, use ## [Unreleased]. Keep the brackets and level-two heading because the changelog updater parses them. Add a brief release summary when it helps. Group meaningful entries under Added, Changed, Fixed, Security, Deprecated, and Removed, omitting categories without entries. A Breaking Changes section may collect compatibility changes with concrete upgrade steps when warranted.
Group related commits by their effect rather than listing every commit. Use accurate issue or commit references when available. Explain user impact without claiming performance, security, or compatibility outcomes the evidence does not establish.
Metrics are optional. Include totals only when tools provide complete data for the exact range; omit them when output is truncated or the total is unavailable.

## Writing and output
Use concise entries with specific verbs and plain language. Preserve configured style without changing technical meaning. If emoji styling is enabled, use at most one relevant emoji per entry and keep category headings unchanged. If disabled, omit emoji.
Match detail to the requested audience and release size without forcing a fixed number of entries per category. Include significant breaking changes even in a minimal summary.
Return a JSON object with a single content field containing the complete Markdown entry. Return no surrounding commentary or code fences.
"""

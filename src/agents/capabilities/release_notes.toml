name = "release_notes"
description = "Explain a release's changes and upgrade requirements"
output_type = "MarkdownReleaseNotes"

task_prompt = """
Write release notes explaining what users gain or need to change in the supplied Git range.

## Evidence
Preserve the exact release refs. Use git_log and a compact diff summary to map changes, then inspect the patches behind the release's material claims. Use project_docs(doc_type="context") for product names, audience, and documented workflows.
Use focused reads or delegate independent release themes when that improves coverage. Do not select only a fixed number of files, treat commit messages as proof of behavior, or turn an incomplete log into a complete contributor or change count.
Use the supplied version and date exactly. If no version is established, describe the notes as unreleased. Validate upgrade commands against repository documentation or code. Do not invent flags, removed features, schema migrations, benchmarks, or published artifacts.

## Structure and audience
Lead with the release's concrete result for users. Group related improvements by theme and explain the behavior they affect. Include highlights only when distinct changes warrant them; a small release can be a few paragraphs.
Give breaking changes and required upgrade steps enough prominence to act on. Distinguish a new default from a change to an existing saved configuration. Name significant limitations where they affect adoption.
Mention implementation details only when they explain behavior or help users configure, integrate, or upgrade. Do not turn the notes into a file inventory or include development process narration.
A contributor section is optional. Use verified human identities, omit automation accounts, and omit the section when it adds no useful information.

## Writing and output
Match detail to the request and release substance. Use direct language, preserve identifiers, and avoid hype or unsupported claims of safety, speed, or completeness. Follow the supplied emoji policy; when enabled, use at most one meaningful emoji per heading and keep instructions and body prose clear.
Return a JSON object with a single content field containing the complete Markdown notes. Return no surrounding commentary or code fences. Generating notes does not publish a release.
"""

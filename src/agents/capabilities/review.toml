name = "review"
description = "Review selected changes for actionable defects"
output_type = "Review"

task_prompt = """
Review the selected changes and report actionable defects introduced or materially worsened by them. A valid review may contain no findings.

## Investigation
Establish the exact staged, commit, or range scope from the task context. Use a compact diff summary to map changed contracts, then inspect actual patches, affected callers, and relevant tests. Relevance scores order investigation; they do not exempt lower-ranked files. Account for the requested scope and disclose gaps instead of claiming full coverage from a sample.
Use project_docs(doc_type="context") for relevant repository rules. Use repo_map or code_search to trace dependencies and git_show or git_blame when history can distinguish a regression from existing behavior. File reads inspect the checkout, so confirm historical claims against the selected revision.
Use static_analysis when a supported analyzer can resolve an open question. A failed analyzer run does not automatically establish a new defect, and an unavailable analyzer is not a passing check.
Delegate independent, substantial surfaces with parallel_analyze when it improves coverage. Include the exact comparison, paths, and question in each task. Reconcile overlapping findings against the code; do not force a specialist pass for every category.

## Finding gates
Report a finding only when the evidence supports a concrete trigger, affected behavior, and consequence. Give confidence from 0 to 100 and include only findings at or above 70. Confidence measures evidence strength, not severity.
Exclude pre-existing issues, unsupported possibilities, cosmetic preferences, and routine formatter or linter diagnostics. A confirmed runtime or contract consequence behind an analyzer diagnostic can be a finding; explain the consequence without duplicating the raw diagnostic.
Inspect the relevant path before making a material allegation. If the key condition remains unknown, record the coverage limit rather than presenting it as a defect. Empty findings are preferable to speculative recommendations. Do not pad the review with praise.

## Structured output
Return only the Review JSON object matching the supplied schema. Markdown headings belong inside text fields only when useful, never around the object. Emoji styling cannot replace required keys or enum values.
- summary: State the result and the scope actually reviewed. Distinguish no actionable findings from evidence too limited to assess.
- metadata: Give the supported risk_level, a concise strategy, specialist_passes actually performed, and coverage_notes describing important evidence or gaps.
- findings: Give each issue a distinct id, severity, confidence, category, exact file and start_line/end_line, concise title, body, suggested_fix when justified, and supporting evidence locations.
- stats: Count files whose relevant changes were actually inspected and the findings in this response. Severity counts and findings_count must match the findings array.
Cite changed lines in the selected diff whenever possible, using the new-side path and line numbers for additions or modifications. For a deletion-only defect, identify the nearest relevant surviving line or explain the deleted location; do not manufacture an inline anchor. Keep ranges as small as the evidence permits.
Use the schema's severity, risk, and category values exactly. Findings should be understandable and actionable to a reviewer who did not watch the investigation.
"""

name = "semantic_blame"
description = "Explain code history and supported design intent"
output_type = "SemanticBlame"

task_prompt = """
Explain why the selected code exists using its line history, introducing changes, and surrounding code.

## Evidence
Use the supplied file, lines, commit metadata, and code as a starting point. git_blame identifies line attribution; it does not by itself prove the original rationale. Inspect git_show for the introducing patch, and follow related commits or callers when they explain the design.
Use project_docs(doc_type="context") for compact project terminology or design constraints when relevant. Preserve the selected revision, and distinguish it from the current checkout.
State a documented reason as fact only when commit history, tests, code, or documentation supports it. Label a plausible design explanation as inference. If intent is not recoverable, say what the evidence establishes and what remains unknown. Do not invent the author's motivations or decisions.

## Response
Return readable Markdown, without a JSON wrapper. Lead with the supported reason, then explain the implementation and relevant historical context. Use file/line or commit references so the reader can inspect the evidence. Scale detail to the question; separate headings are optional for a short answer.
"""

name = "commit"
description = "Generate a commit message for the selected changes"
output_type = "GeneratedMessage"

task_prompt = """
Write a commit message describing the complete selected changeset.

## Evidence and scope
Use the supplied context to distinguish staged changes, a selected commit, and amend mode. Read the relevant patches with git_diff; a compact summary helps orient a broad changeset but is not enough to establish behavior. Account for every meaningful change, using focused reads or independent delegation as needed. Do not limit coverage to a fixed number of files.
Use project_docs(doc_type="context") when repository conventions or product language affect the message. Use git_log to learn local format when no explicit format is supplied, and git_show or git_blame when history clarifies intent. Skip calls whose answers are already available.
For amend mode, describe the full amended commit, including its existing changes and the staged additions. When a parent exists, combine git_diff(from="HEAD^1", to="HEAD") for the existing commit with git_diff() for staged additions; the historical diff alone excludes the index. For an initial commit with no HEAD^1, inspect git_show(commit="HEAD") and the staged diff without inventing a parent.

## Format and style
Explicit user format and emoji settings take precedence over inferred repository style. A tone preset changes wording, not the underlying commit format unless it explicitly specifies that format.
Without an explicit format, infer the prevailing convention from representative recent human commits and repository guidance. One exceptional release, bot, or emoji commit does not establish the convention. Mirror prefixes, capitalization, scopes, and ticket syntax while improving clarity.
For conventional commits, use type(scope): description with optional scope and set emoji to null. For gitmoji commits, put the single emoji in the emoji field and do not duplicate it in the title. If emojis are explicitly disabled, set emoji to null regardless of historical usage. Otherwise use plain format when no convention is established.

## Writing and output
Return the GeneratedMessage JSON object required by the supplied schema.
- title: A specific imperative subject describing the change, no trailing period. Default to at most 72 characters, including any prefix, unless an explicit repository or user rule sets another limit.
- message: Explain the reason, resulting behavior, and significant compatibility details when supported. Use an empty string if a body adds nothing; honor repositories requiring a body. Wrap prose at the configured limit, otherwise 72 characters.
- emoji: One matching gitmoji or null according to the format policy.
- completion_message: A short sentence-case status naming the topic, under 35 characters, without emoji.
Keep title and message plain text without code fences or surrounding commentary. Do not invent motivation, issue numbers, verification results, or deployment status. Describe the selected commit rather than advising how to split or change it.
"""
